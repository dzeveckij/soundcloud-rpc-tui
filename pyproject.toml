[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundcloud-rpc-tui"
version = "0.2.0"
description = "Terminal SoundCloud client with account features, playback, and Discord Rich Presence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10",
    "pypresence>=4.6",
    "requests>=2.31",
    "textual>=8.0",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soundcloud-rpc-tui = "soundcloud_rpc_tui.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
