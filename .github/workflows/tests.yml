name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # A real mpv lets the tests check its IPC: a Unix socket on Linux, a named pipe on Windows.
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv

      - name: Install mpv (Windows)
        if: runner.os == 'Windows'
        run: choco install mpv --no-progress -y

      - name: Install
        run: python -m pip install '.[dev]'

      - name: Test
        run: python -m pytest -v

      - name: Check the installed command
        shell: python
        run: |
          import shutil, sys
          from importlib.metadata import entry_points
          scripts = {entry.name for entry in entry_points(group="console_scripts")}
          assert "soundcloud-rpc-tui" in scripts, scripts
          assert shutil.which("soundcloud-rpc-tui"), "soundcloud-rpc-tui isn't on PATH"
          import soundcloud_rpc_tui.ui.app
